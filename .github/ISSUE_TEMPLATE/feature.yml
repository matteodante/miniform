name: Feature proposal
description: Propose a focused improvement that fits Miniform's scope
title: "[Proposal]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem. Large proposals may be moved to Discussions before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution and its user-facing behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workarounds and why they are insufficient.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and operational impact
      description: Cover migrations, configuration, security, privacy, performance, and maintenance cost.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This preserves Miniform's self-hosted, single-process, SQLite-first model or clearly justifies changing it.
          required: true
        - label: I searched existing issues, discussions, and the roadmap.
          required: true
