version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gocyclo:
      min-complexity: 25
    staticcheck:
      checks:
        - all
        - -QF1008
  exclusions:
    warn-unused: true
    presets:
      - comments
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocyclo
          - revive

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
