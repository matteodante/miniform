<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submission not sent</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #171a2b; background: #ffded9; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 34rem); border: 1px solid #ffbdb5; border-radius: 1.5rem; background: #fff; padding: clamp(2rem, 7vw, 4rem); box-shadow: 0 1.5rem 4rem rgb(23 26 43 / 12%); }
    .status { display: inline-grid; width: 4rem; height: 4rem; place-items: center; border-radius: 1rem; background: #fff0ee; color: #c9483e; font-size: 1.5rem; font-weight: 800; }
    h1 { margin: 1.5rem 0 .75rem; font-size: clamp(2.4rem, 9vw, 4.5rem); line-height: .95; letter-spacing: -.055em; }
    p { color: #6f7891; line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
    a, button { border: 1px solid #ccd2e2; border-radius: .8rem; background: #fff; padding: .8rem 1rem; color: #171a2b; font: 700 .9rem/1 ui-sans-serif, system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    a { border-color: #4057f4; background: #4057f4; color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="status" aria-hidden="true">!</div>
    <h1>Not sent yet.</h1>
    <p>Miniform could not accept this submission. Check the fields and connection, then try once more.</p>
    <nav aria-label="Recovery actions">
      <button type="button" onclick="history.back()">Review the form</button>
      <a href="/">Return home</a>
    </nav>
  </main>
</body>
</html>
