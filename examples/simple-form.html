<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact form · Miniform example</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; color: #171a2b; background: #f1f3f9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
    main { width: min(100%, 42rem); border: 1px solid #d8ddea; border-radius: 1.25rem; background: #fff; padding: clamp(1.5rem, 5vw, 3rem); box-shadow: 0 1.5rem 4rem rgb(23 26 43 / 10%); }
    .eyebrow { margin: 0; color: #4057f4; font: 700 .7rem/1 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: .75rem 0 0; font-size: clamp(2.25rem, 8vw, 4rem); line-height: .95; letter-spacing: -.05em; }
    .intro { margin: 1rem 0 2rem; color: #6f7891; line-height: 1.6; }
    form { display: grid; gap: 1.1rem; }
    label { display: grid; gap: .45rem; font-size: .85rem; font-weight: 700; }
    input, textarea { width: 100%; border: 1px solid #ccd2e2; border-radius: .8rem; background: #fff; padding: .8rem .9rem; color: inherit; font: inherit; }
    input:focus, textarea:focus { outline: 3px solid rgb(64 87 244 / 20%); border-color: #4057f4; }
    button { justify-self: start; border: 0; border-radius: .8rem; background: #4057f4; padding: .85rem 1.25rem; color: #fff; font: inherit; font-size: .9rem; font-weight: 700; line-height: 1; cursor: pointer; }
    button:hover { background: #2d3ec3; }
    .honeypot { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    aside { margin-top: 2rem; border-left: 3px solid #4057f4; padding-left: 1rem; color: #515a73; font-size: .8rem; line-height: 1.6; }
    code { font-family: ui-monospace, monospace; color: #2d3ec3; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Miniform · native HTML</p>
    <h1>Send a message.</h1>
    <p class="intro">This page needs no client-side JavaScript. The browser posts the fields and follows Miniform’s response redirect.</p>

    <form action="http://localhost:8080/forms/YOUR_FORM_SLUG/submit?token=YOUR_FORM_TOKEN" method="post">
      <label>Name <input name="name" type="text" autocomplete="name" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Message <textarea name="message" rows="6" required></textarea></label>

      <label class="honeypot" aria-hidden="true">Leave this field empty
        <input name="__mf_hp" type="text" tabindex="-1" autocomplete="off">
      </label>
      <input name="_success_url" type="hidden" value="/thank-you.html">
      <input name="_error_url" type="hidden" value="/error.html">
      <button type="submit">Send message</button>
    </form>

    <aside>Before testing, replace <code>YOUR_FORM_SLUG</code> and <code>YOUR_FORM_TOKEN</code>, then add this page’s host to the endpoint allowlist.</aside>
  </main>
</body>
</html>
