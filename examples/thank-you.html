<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message received</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #171a2b; background: #e1e5ff; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; }
    main { width: min(100%, 34rem); border: 1px solid #c9d0ff; border-radius: 1.5rem; background: #fff; padding: clamp(2rem, 7vw, 4rem); box-shadow: 0 1.5rem 4rem rgb(23 26 43 / 12%); }
    .status { display: inline-grid; width: 4rem; height: 4rem; place-items: center; border-radius: 1rem; background: #d2f0e7; color: #147d64; font-size: 2rem; }
    h1 { margin: 1.5rem 0 .75rem; font-size: clamp(2.4rem, 9vw, 4.5rem); line-height: .95; letter-spacing: -.055em; }
    p { color: #6f7891; line-height: 1.65; }
    a { display: inline-flex; margin-top: 1rem; border-radius: .8rem; background: #4057f4; padding: .8rem 1rem; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="status" aria-hidden="true">✓</div>
    <h1>Message received.</h1>
    <p>The submission reached Miniform successfully. You can close this page or return to the site.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
