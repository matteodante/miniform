{{ define "admin/forms/templates/content" }}
<div class="space-y-10">
    <header class="border-b border-rule pb-8">
        <p class="mf-kicker">New endpoint</p>
        <h1 class="mf-title mt-3">Choose a starting point.</h1>
        <p class="mt-4 max-w-xl text-sm leading-6 text-ink-muted">Use a proven field set or begin with a blank endpoint. Everything remains editable.</p>
    </header>

    <section class="grid border-l border-t border-rule sm:grid-cols-2" aria-label="Endpoint starting points">
        {{ range .Templates }}
        <a href="/admin/forms/new?template={{ .ID }}" hx-boost="false"
            class="group min-h-48 border-b border-r border-rule bg-paper-raised p-6 transition-colors hover:bg-moss-pale/45 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-moss">
            <div class="flex items-start justify-between gap-4">
                <code class="font-mono text-[0.625rem] uppercase tracking-[0.16em] text-moss">{{ .ID }}</code>
                <span class="font-mono text-xs text-ink-muted transition-transform group-hover:translate-x-1" aria-hidden="true">→</span>
            </div>
            <h2 class="mt-8 font-display text-3xl tracking-[-0.03em] text-ink group-hover:text-moss-dark">{{ .Name }}</h2>
            <p class="mt-3 max-w-sm text-sm leading-6 text-ink-muted">{{ .Description }}</p>
        </a>
        {{ end }}
    </section>

    <a href="/admin/forms" class="inline-flex font-mono text-xs font-semibold text-ink underline decoration-rule underline-offset-4 hover:decoration-moss">← Back to endpoints</a>
</div>
{{ end }}
