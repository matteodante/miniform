{{ define "admin/mailers/new/content" }}
<div class="mx-auto max-w-4xl space-y-6">
    <header>
        <p class="mf-kicker">Email routes</p>
        <h1 class="mt-2 text-3xl font-bold text-ink">{{ if .IsEdit }}Edit email route{{ else }}New email route{{ end }}</h1>
        <p class="mt-2 text-sm text-ink-muted">Connect SMTP or Mailgun once, then reuse it across forms.</p>
    </header>

    {{ if .Error }}
    <div role="alert" class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-800">{{ .Error }}</div>
    {{ end }}

    <form method="POST" action="{{ if .IsEdit }}/admin/settings/mailers/{{ .Profile.ID }}{{ else }}/admin/settings/mailers{{ end }}" class="space-y-5">
        <section class="mf-panel p-6">
            <div class="grid gap-5 sm:grid-cols-2">
                <label class="grid gap-2 text-sm font-medium text-ink" for="name">
                    Profile name
                    <input class="mf-input w-full" id="name" name="name" type="text" required
                        value="{{ if .Profile }}{{ .Profile.Name }}{{ end }}" placeholder="Support delivery">
                </label>
                <label class="grid gap-2 text-sm font-medium text-ink" for="provider">
                    Provider
                    <select class="mf-input w-full" id="provider" name="provider" required>
                        <option value="smtp" {{ if or (not .Profile) (eq .Profile.Provider "smtp") }}selected{{ end }}>SMTP</option>
                        <option value="mailgun" {{ if and .Profile (eq .Profile.Provider "mailgun") }}selected{{ end }}>Mailgun</option>
                    </select>
                </label>
            </div>
        </section>

        <section class="mf-panel p-6">
            <h2 class="text-lg font-semibold text-ink">Provider connection</h2>
            <div data-config="mailgun" class="mt-5 grid gap-5 sm:grid-cols-2">
                <label class="grid gap-2 text-sm font-medium text-ink" for="api_key">
                    API key
                    <input class="mf-input w-full font-mono text-sm" id="api_key" name="api_key" type="password"
                        value="{{ if .Profile }}{{ .Profile.APIKey }}{{ end }}" placeholder="key-xxxxxxxx">
                </label>
                <label class="grid gap-2 text-sm font-medium text-ink" for="domain">
                    Sending domain
                    <input class="mf-input w-full" id="domain" name="domain" type="text"
                        value="{{ if .Profile }}{{ .Profile.Domain }}{{ end }}" placeholder="mg.example.com">
                </label>
            </div>
            <div data-config="smtp" class="mt-5 grid gap-5 sm:grid-cols-2">
                <label class="grid gap-2 text-sm font-medium text-ink sm:col-span-2" for="smtp_host">
                    SMTP host
                    <input class="mf-input w-full" id="smtp_host" name="smtp_host" type="text"
                        value="{{ if .Profile }}{{ .Profile.SMTPHost }}{{ end }}" placeholder="smtp.example.com">
                </label>
                <label class="grid gap-2 text-sm font-medium text-ink" for="smtp_port">
                    Port
                    <input class="mf-input w-full" id="smtp_port" name="smtp_port" type="number"
                        value="{{ if and .Profile .Profile.SMTPPort }}{{ .Profile.SMTPPort }}{{ else }}587{{ end }}">
                </label>
                <label class="grid gap-2 text-sm font-medium text-ink" for="smtp_encryption">
                    Encryption
                    <select class="mf-input w-full" id="smtp_encryption" name="smtp_encryption">
                        <option value="starttls" {{ if and .Profile (eq .Profile.SMTPEncryption "starttls") }}selected{{ end }}>STARTTLS</option>
                        <option value="tls" {{ if and .Profile (eq .Profile.SMTPEncryption "tls") }}selected{{ end }}>Implicit TLS</option>
                        <option value="none" {{ if and .Profile (eq .Profile.SMTPEncryption "none") }}selected{{ end }}>None</option>
                    </select>
                </label>
                <label class="grid gap-2 text-sm font-medium text-ink" for="smtp_username">
                    Username <span class="text-xs font-normal text-ink-muted">Optional for trusted relays</span>
                    <input class="mf-input w-full" id="smtp_username" name="smtp_username" type="text"
                        value="{{ if .Profile }}{{ .Profile.SMTPUsername }}{{ end }}" placeholder="user@example.com">
                </label>
                <label class="grid gap-2 text-sm font-medium text-ink" for="smtp_password">
                    Password
                    <input class="mf-input w-full font-mono text-sm" id="smtp_password" name="smtp_password" type="password"
                        value="{{ if .Profile }}{{ .Profile.SMTPPassword }}{{ end }}">
                </label>
            </div>
        </section>

        <section class="mf-panel p-6">
            <h2 class="text-lg font-semibold text-ink">Sender defaults</h2>
            <div class="mt-5 grid gap-5 sm:grid-cols-2">
                <label class="grid gap-2 text-sm font-medium text-ink" for="default_from_name">
                    From name
                    <input class="mf-input w-full" id="default_from_name" name="default_from_name" type="text"
                        value="{{ if .Profile }}{{ .Profile.DefaultFromName }}{{ end }}" placeholder="Miniform">
                </label>
                <label class="grid gap-2 text-sm font-medium text-ink" for="default_from_email">
                    From email
                    <input class="mf-input w-full" id="default_from_email" name="default_from_email" type="email"
                        value="{{ if .Profile }}{{ .Profile.DefaultFromEmail }}{{ end }}" placeholder="no-reply@example.com">
                </label>
                <label class="grid gap-2 text-sm font-medium text-ink sm:col-span-2" for="defaults_json">
                    Provider defaults <span class="font-mono text-xs font-normal text-ink-muted">JSON object · optional</span>
                    <textarea class="mf-input w-full font-mono text-sm" id="defaults_json" name="defaults_json" rows="5"
                        placeholder='{"tags":["form-submission"]}'>{{ if .Profile }}{{ .Profile.DefaultsJSON }}{{ end }}</textarea>
                </label>
            </div>
        </section>

        <div class="flex justify-end gap-3">
            <a class="mf-button-secondary" href="/admin/settings/mailers">Cancel</a>
            <button class="mf-button" type="submit">{{ if .IsEdit }}Save changes{{ else }}Create email route{{ end }}</button>
        </div>
    </form>
</div>
<script>
(() => {
    const provider = document.getElementById("provider");
    const sync = () => document.querySelectorAll("[data-config]").forEach(group => {
        group.style.display = group.dataset.config === provider.value ? "" : "none";
    });
    provider.addEventListener("change", sync);
    sync();
})();
</script>
{{ end }}
