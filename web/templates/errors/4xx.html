{{ define "errors/4xx/content" }}
<div class="mx-auto flex min-h-[60vh] max-w-3xl items-center px-5 py-12">
    <div class="mf-panel w-full p-8 sm:p-10">
        <div class="grid gap-8 sm:grid-cols-[auto_minmax(0,1fr)]">
            <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-amber-50 font-mono text-xl font-bold text-amber-700">{{ .Status }}</div>
            <div>
                <p class="mf-kicker">Request error</p>
                <h1 class="mt-2 text-3xl font-bold text-ink">{{ .ErrorMessage }}</h1>
                <p class="mt-3 text-sm leading-6 text-ink-muted">The request could not be completed. Return to the inbox and try again.</p>
                <div class="mt-6 flex flex-wrap gap-3">
                    <button class="mf-button-secondary" type="button" onclick="history.back()">Go back</button>
                    <a class="mf-button" href="{{ .RecoveryURL }}">Open inbox</a>
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
