{{ define "errors/500/content" }}
<div class="mx-auto flex min-h-[60vh] max-w-3xl items-center px-5 py-12">
    <div class="mf-panel w-full overflow-hidden">
        <div class="grid gap-8 p-8 sm:grid-cols-[auto_minmax(0,1fr)] sm:p-10">
            <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-rose-50 font-mono text-xl font-bold text-rose-700">500</div>
            <div>
                <p class="mf-kicker">Server error</p>
                <h1 class="mt-2 text-3xl font-bold text-ink">The request could not be completed</h1>
                <p class="mt-3 text-sm leading-6 text-ink-muted">Try again in a moment. If the problem persists, check the server logs for the matching request.</p>
                <div class="mt-6 flex flex-wrap gap-3">
                    <button class="mf-button-secondary" type="button" onclick="history.back()">Go back</button>
                    <a class="mf-button" href="/admin/submissions">Open inbox</a>
                </div>
            </div>
        </div>
        {{ if and .DevMode .ErrorMessage }}
        <details class="border-t border-rule bg-gray-50 p-6">
            <summary class="cursor-pointer text-sm font-semibold text-ink">Development details</summary>
            <pre class="mt-4 overflow-auto whitespace-pre-wrap break-words rounded-xl bg-gray-900 p-4 font-mono text-xs text-gray-100">{{ .ErrorMessage }}</pre>
        </details>
        {{ end }}
    </div>
</div>
{{ end }}
